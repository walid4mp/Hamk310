services:
  - type: web
    name: mizanpro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build && npm run seed
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mizanpro-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: mizanpro-db
    plan: free
